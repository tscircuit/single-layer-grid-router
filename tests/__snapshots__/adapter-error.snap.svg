pe="point" data-label="MC8" data-x="8" data-y="5" cx="563.4782608695652" cy="167.82608695652172" r="3" fill="#222"/></g><g><circle data-type="point" data-label="U1.12" data-x="2.5" data-y="1.27" cx="396.0869565217391" cy="281.3478260869565" r="3" fill="#222"/></g><g><circle data-type="point" data-label="MC9" data-x="8" data-y="3" cx="563.4782608695652" cy="228.69565217391303" r="3" fill="#222"/></g><g><circle data-type="point" data-label="U1.11" data-x="2.5" data-y="0" cx="396.0869565217391" cy="320" r="3" fill="#222"/></g><g><circle data-type="point" data-label="MC10" data-x="8" data-y="1" cx="563.4782608695652" cy="289.5652173913044" r="3" fill="#222"/></g><g><circle data-type="point" data-label="U1.10" data-x="2.5" data-y="-1.27" cx="396.0869565217391" cy="358.6521739130435" r="3" fill="#222"/></g><g><circle data-type="point" data-label="MC11" data-x="8" data-y="-1" cx="563.4782608695652" cy="350.4347826086956" r="3" fill="#222"/></g><g><circle data-type="point" data-label="U1.9" data-x="2.5" data-y="-2.54" cx="396.0869565217391" cy="397.304347826087" r="3" fill="#222"/></g><g><circle data-type="point" data-label="MC12" data-x="8" data-y="-3" cx="563.4782608695652" cy="411.304347826087" r="3" fill="#222"/></g><g><circle data-type="point" data-label="U1.8" data-x="2.5" data-y="-3.81" cx="396.0869565217391" cy="435.95652173913044" r="3" fill="#222"/></g><g><circle data-type="point" data-label="MC13" data-x="8" data-y="-5" cx="563.4782608695652" cy="472.17391304347825" r="3" fill="#222"/></g><g><circle data-type="point" data-label="U1.14" data-x="2.5" data-y="3.81" cx="396.0869565217391" cy="204.04347826086956" r="3" fill="#222"/></g><g><circle data-type="point" data-label="C1.2" data-x="2.5" data-y="6.2" cx="396.0869565217391" cy="131.30434782608694" r="3" fill="#222"/></g><g><circle data-type="point" data-label="MC7" data-x="0" data-y="8" cx="320" cy="76.52173913043475" r="3" fill="#222"/></g><g><circle data-type="point" data-label="MP2" data-x="-8" data-y="8" cx="76.52173913043475" cy="76.52173913043475" r="3" fill="#222"/></g><g><circle data-type="point" data-label="MP3" data-x="8" data-y="8" cx="563.4782608695652" cy="76.52173913043475" r="3" fill="#222"/></g><g><circle data-type="point" data-label="U1.7" data-x="-2.5" data-y="-3.81" cx="243.91304347826087" cy="435.95652173913044" r="3" fill="#222"/></g><g><circle data-type="point" data-label="C1.1" data-x="1.5" data-y="6.2" cx="365.6521739130435" cy="131.30434782608694" r="3" fill="#222"/></g><g><circle data-type="point" data-label="MC14" data-x="0" data-y="-8" cx="320" cy="563.4782608695652" r="3" fill="#222"/></g><g><circle data-type="point" data-label="MP1" data-x="-8" data-y="-8" cx="76.52173913043475" cy="563.4782608695652" r="3" fill="#222"/></g><g><circle data-type="point" data-label="MP4" data-x="8" data-y="-8" cx="563.4782608695652" cy="563.4782608695652" r="3" fill="#222"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":30.434782608695656,"c":0,"e":320,"b":0,"d":-30.434782608695656,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
