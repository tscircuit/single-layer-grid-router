<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-3.93,-0.03 -3.9,0 -2.0999999999999996,0 -2.0999999999999996,-0.09999999999999964 -2,-0.09999999999999964 -2,-0.19999999999999973 -1.9,-0.19999999999999973 -1.9,-0.2999999999999998 -1.7999999999999998,-0.2999999999999998 -1.7999999999999998,-0.5 -1.6999999999999997,-0.5 -1.6999999999999997,-0.5999999999999996 -1.5999999999999996,-0.5999999999999996 -1.5999999999999996,-0.7999999999999998 -1.5,-0.7999999999999998 -1.5,-0.8999999999999999 -1.4,-0.8999999999999999 -1.4,-1.0999999999999996 -1.2999999999999998,-1.0999999999999996 -1.2999999999999998,-1.1999999999999997 -1.1999999999999997,-1.1999999999999997 -1.1999999999999997,-1.2999999999999998 -1.0999999999999996,-1.2999999999999998 -1.0999999999999996,-1.5 -1,-1.5 -1,-1.5999999999999996 -0.8999999999999995,-1.5999999999999996 -0.8999999999999995,-1.6999999999999997 0.7000000000000002,-1.6999999999999997 0.7000000000000002,-1.2999999999999998 0.9000000000000004,-1.2999999999999998 0.9000000000000004,-1.1999999999999997 1.1000000000000005,-1.1999999999999997 1.1000000000000005,-1.0999999999999996 1.4000000000000004,-1.0999999999999996 1.4000000000000004,-1 1.6000000000000005,-1 1.6000000000000005,-0.8999999999999999 1.8000000000000007,-0.8999999999999999 1.8000000000000007,-0.7999999999999998 1.9000000000000004,-0.7999999999999998 1.9000000000000004,-0.5999999999999996 2,-0.5999999999999996 2,-0.3999999999999999 2.1000000000000005,-0.3999999999999999 2.1000000000000005,-0.09999999999999964 3.9000000000000004,-0.09999999999999964 3.9000000000000004,0 3.93,0.03" data-type="line" data-label="signal" points="99.91999999999999,321.68 101.6,320 202.40000000000003,320 202.40000000000003,325.59999999999997 208,325.59999999999997 208,331.2 213.60000000000002,331.2 213.60000000000002,336.8 219.20000000000002,336.8 219.20000000000002,348 224.8,348 224.8,353.59999999999997 230.40000000000003,353.59999999999997 230.40000000000003,364.8 236,364.8 236,370.4 241.60000000000002,370.4 241.60000000000002,381.59999999999997 247.20000000000002,381.59999999999997 247.20000000000002,387.2 252.8,387.2 252.8,392.79999999999995 258.40000000000003,392.79999999999995 258.40000000000003,404 264,404 264,409.59999999999997 269.6,409.59999999999997 269.6,415.2 359.2,415.2 359.2,392.79999999999995 370.40000000000003,392.79999999999995 370.40000000000003,387.2 381.6,387.2 381.6,381.59999999999997 398.40000000000003,381.59999999999997 398.40000000000003,376 409.6,376 409.6,370.4 420.80000000000007,370.4 420.80000000000007,364.8 426.40000000000003,364.8 426.40000000000003,353.59999999999997 432,353.59999999999997 432,342.4 437.6,342.4 437.6,325.59999999999997 538.4000000000001,325.59999999999997 538.4000000000001,320 540.08,318.32" fill="none" stroke="#e53935" stroke-linejoin="round" stroke-width="11.200000000000001"/></g><g><rect data-type="rect" data-label="" data-x="0" data-y="0" x="40" y="96" width="560" height="448" fill="transparent" stroke="#777" stroke-width="0.017857142857142856"/></g><g><rect data-type="rect" data-label="" data-x="-1" data-y="0" data-ccw-rotation-degrees="35" x="236.00000000000003" y="250" width="55.99999999999996" height="139.99999999999997" fill="#999999" stroke="#444" stroke-width="0.017857142857142856" transform="rotate(-35.000000000000014 264 320)"/></g><g><rect data-type="rect" data-label="" data-x="1" data-y="0" x="334" y="278" width="84" height="84" fill="#999999" stroke="#444" stroke-width="0.017857142857142856"/></g><g><circle data-type="point" data-label="" data-x="-3.93" data-y="-0.03" cx="99.91999999999999" cy="321.68" r="3" fill="#222"/></g><g><circle data-type="point" data-label="" data-x="3.93" data-y="0.03" cx="540.08" cy="318.32" r="3" fill="#222"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":56,"c":0,"e":320,"b":0,"d":-56,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>